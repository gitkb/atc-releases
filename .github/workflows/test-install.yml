name: Test Install Script

on:
  # Auto-trigger after every mirrored release
  workflow_run:
    workflows: ["Mirror Release"]
    types: [completed]

  # Test PRs that touch the installer or its tests
  pull_request:
    paths: [install.sh, test/**, .github/workflows/test-install.yml]

  # Manual trigger with optional version override
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install (e.g. 0.1.18). Blank = latest."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux — Docker containers give a clean, minimal environment. The binaries
  # need glibc 2.28, so the oldest images run on both architectures.
  # ---------------------------------------------------------------------------
  test-linux:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:22.04
            runner: ubuntu-latest
            name: ubuntu-22.04-x64
          - distro: debian:bookworm-slim
            runner: ubuntu-latest
            name: debian-bookworm-x64
          - distro: ubuntu:24.04
            runner: ubuntu-latest
            name: ubuntu-24.04-x64
          - distro: ubuntu:22.04
            runner: ubuntu-24.04-arm
            name: ubuntu-22.04-arm64
          - distro: ubuntu:24.04
            runner: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    runs-on: ${{ matrix.runner }}
    name: linux / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Pull Docker image (cached by runner)
        run: docker pull ${{ matrix.distro }}

      # No GitHub token anywhere: the point of this repo is that a stranger's
      # machine can install ATC.
      - name: Run install.sh in Docker
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          docker run --rm \
            -e VERSION="${INPUT_VERSION:-latest}" \
            -v "${{ github.workspace }}:/src:ro" \
            ${{ matrix.distro }} \
            bash -c '
              set -euo pipefail

              # --- Dependencies ------------------------------------------------
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null

              # --- Run installer as a normal user, as a new user would ---------
              # Then: every archive binary installed and runs (correct arch, no
              # missing libs); stderr is clean and the PATH hint works.
              useradd -m tester
              su tester -s /bin/bash -c "cd \
                && { bash /src/install.sh >out.log 2>err.log || { cat out.log err.log; exit 1; }; } \
                && bash /src/test/verify-install.sh \
                && bash /src/test/check-install-output.sh out.log err.log"
            '

  # ---------------------------------------------------------------------------
  # macOS — native runners (can't use Docker on macOS)
  # ---------------------------------------------------------------------------
  test-macos:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    name: macos / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run install.sh
        env:
          VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: bash install.sh >/tmp/install_stdout.log 2>/tmp/install_stderr.log

      - name: Verify installation
        run: |
          bash test/verify-install.sh
          bash test/check-install-output.sh /tmp/install_stdout.log /tmp/install_stderr.log

          # The signed hotkey app lands where atc looks for it, signature intact.
          app="$HOME/.local/libexec/ATC Hotkey.app"
          test -d "$app" || { echo "FAIL: ATC Hotkey.app not installed"; exit 1; }
          codesign --verify --deep --strict "$app"

  # ---------------------------------------------------------------------------
  # Refusals — systems outside the support contract get one error line before
  # anything is downloaded. Windows shells are faked with a `uname` stub.
  # ---------------------------------------------------------------------------
  test-refusal:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: refusal / linux
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # bash:5.2 is Alpine with bash but no curl: the musl line must come
      # before "curl is required".
      - name: musl (Alpine)
        run: docker run --rm -v "${{ github.workspace }}:/src:ro" bash:5.2 bash /src/test/check-refusal.sh musl

      - name: INSTALL_DIR the user can't write
        run: >-
          docker run --rm --user ubuntu -v "${{ github.workspace }}:/src:ro" ubuntu:24.04
          env INSTALL_DIR=/usr/local/bin bash /src/test/check-refusal.sh 'Pick a directory you own'

      - name: glibc older than 2.28 (Ubuntu 18.04)
        run: docker run --rm -v "${{ github.workspace }}:/src:ro" ubuntu:18.04 bash /src/test/check-refusal.sh 'glibc 2.27'

      - name: Git Bash, MSYS2, Cygwin
        run: |
          for uname in MINGW64_NT-10.0-26100 MSYS_NT-10.0-26100 CYGWIN_NT-10.0-26100; do
            bash test/check-refusal.sh WSL2 "$uname"
          done

  # Native Git Bash on Windows, run by hand (Windows is not in the contract).
  test-refusal-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    name: refusal / windows git bash
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Git Bash refuses with the WSL2 line
        run: |
          uname -s
          bash test/check-refusal.sh WSL2

  # ---------------------------------------------------------------------------
  # Summary — single required check for branch protection
  # ---------------------------------------------------------------------------
  results:
    if: always()
    needs: [test-linux, test-macos, test-refusal]
    runs-on: ubuntu-latest
    name: results
    steps:
      - name: Aggregate results
        env:
          LINUX: ${{ needs.test-linux.result }}
          MACOS: ${{ needs.test-macos.result }}
          REFUSAL: ${{ needs.test-refusal.result }}
        run: |
          echo "linux:   $LINUX"
          echo "macos:   $MACOS"
          echo "refusal: $REFUSAL"
          if [[ "$LINUX" == "skipped" && "$MACOS" == "skipped" && "$REFUSAL" == "skipped" ]]; then
            echo "Tests skipped (upstream workflow did not succeed)."
            exit 0
          fi
          # Treat skipped as acceptable when paired with success
          if [[ "$LINUX" =~ ^(success|skipped)$ && "$MACOS" =~ ^(success|skipped)$ && "$REFUSAL" =~ ^(success|skipped)$ ]]; then
            echo "All install tests passed."
          else
            echo "One or more install tests failed."
            exit 1
          fi
