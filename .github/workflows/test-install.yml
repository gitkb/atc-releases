name: Test Install Script

on:
  # Auto-trigger after every mirrored release
  workflow_run:
    workflows: ["Mirror Release"]
    types: [completed]

  # Test PRs that touch the installer
  pull_request:
    paths: [install.sh]

  # Manual trigger with optional version override
  workflow_dispatch:
    inputs:
      version:
        description: "Version to install (e.g. 0.1.18). Blank = latest."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux — Docker containers give a clean, minimal environment. The binaries
  # need glibc 2.28, so the oldest images run on both architectures.
  # ---------------------------------------------------------------------------
  test-linux:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:22.04
            runner: ubuntu-latest
            name: ubuntu-22.04-x64
          - distro: debian:bookworm-slim
            runner: ubuntu-latest
            name: debian-bookworm-x64
          - distro: ubuntu:24.04
            runner: ubuntu-latest
            name: ubuntu-24.04-x64
          - distro: ubuntu:22.04
            runner: ubuntu-24.04-arm
            name: ubuntu-22.04-arm64
          - distro: ubuntu:24.04
            runner: ubuntu-24.04-arm
            name: ubuntu-24.04-arm64
    runs-on: ${{ matrix.runner }}
    name: linux / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Pull Docker image (cached by runner)
        run: docker pull ${{ matrix.distro }}

      # No GitHub token anywhere: the point of this repo is that a stranger's
      # machine can install ATC.
      - name: Run install.sh in Docker
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          docker run --rm \
            -e VERSION="${INPUT_VERSION:-latest}" \
            -v "${{ github.workspace }}/install.sh:/install.sh:ro" \
            ${{ matrix.distro }} \
            bash -c '
              set -euo pipefail

              # --- Dependencies ------------------------------------------------
              apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null

              # --- Run installer -----------------------------------------------
              bash /install.sh 2>/tmp/install_stderr.log

              # --- Assertions ---------------------------------------------------
              for binary in atc atc-productionize; do
                test -x "$HOME/.local/bin/$binary" || { echo "FAIL: $binary not installed"; exit 1; }
              done
              "$HOME/.local/bin/atc" --version     # proves correct arch + no missing libs

              # No unbound variable errors or other stderr noise.
              # Filter known-harmless tar warnings about unknown xattr headers
              # (tarballs packaged on macOS carry LIBARCHIVE.xattr.* headers;
              # GNU tar warns but extracts cleanly).
              if grep -v "^tar: Ignoring unknown extended header keyword" \
                   /tmp/install_stderr.log | grep -q .; then
                echo "FAIL: install.sh produced unexpected stderr output:"
                cat /tmp/install_stderr.log
                exit 1
              fi
            '

  # ---------------------------------------------------------------------------
  # macOS — native runners (can't use Docker on macOS)
  # ---------------------------------------------------------------------------
  test-macos:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.runner }}
    name: macos / ${{ matrix.name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run install.sh
        env:
          VERSION: ${{ github.event.inputs.version || 'latest' }}
        run: bash install.sh 2>/tmp/install_stderr.log

      - name: Verify installation
        run: |
          for binary in atc atc-productionize; do
            test -x "$HOME/.local/bin/$binary" || { echo "FAIL: $binary not installed"; exit 1; }
          done
          "$HOME/.local/bin/atc" --version

          # The signed hotkey app lands where atc looks for it, signature intact.
          app="$HOME/.local/libexec/ATC Hotkey.app"
          test -d "$app" || { echo "FAIL: ATC Hotkey.app not installed"; exit 1; }
          codesign --verify --deep --strict "$app"

          if grep -v "^tar: Ignoring unknown extended header keyword" \
               /tmp/install_stderr.log | grep -q .; then
            echo "FAIL: install.sh produced unexpected stderr output:"
            cat /tmp/install_stderr.log
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Summary — single required check for branch protection
  # ---------------------------------------------------------------------------
  results:
    if: always()
    needs: [test-linux, test-macos]
    runs-on: ubuntu-latest
    name: results
    steps:
      - name: Aggregate results
        env:
          LINUX: ${{ needs.test-linux.result }}
          MACOS: ${{ needs.test-macos.result }}
        run: |
          echo "linux:  $LINUX"
          echo "macos:  $MACOS"
          if [[ "$LINUX" == "skipped" && "$MACOS" == "skipped" ]]; then
            echo "Tests skipped (upstream workflow did not succeed)."
            exit 0
          fi
          # Treat skipped as acceptable when paired with success
          if [[ "$LINUX" =~ ^(success|skipped)$ && "$MACOS" =~ ^(success|skipped)$ ]]; then
            echo "All install tests passed."
          else
            echo "One or more install tests failed."
            exit 1
          fi
